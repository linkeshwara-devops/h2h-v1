
name: Deploy Harvest2Hotel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and push Docker image
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: linkeshwara/h2h-v1:latest

      # 4. Connect to EC2 and deploy
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            docker login -u "$DOCKER_USERNAME" -p "$DOCKER_PASSWORD"
            docker pull linkeshwara/h2h-v1:latest
            docker stop h2h-container || true
            docker rm h2h-container || true
            docker run -d \
              --name h2h-container \
              --restart unless-stopped \
              -p 5000:5000 \
              linkeshwara/h2h-v1:latest
            docker ps
